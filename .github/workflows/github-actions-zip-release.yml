name: Create PK3 Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build split PK3s
        shell: bash
        run: |
          set -e

          mkdir -p build
          mkdir -p current

          # Keep each PK3 comfortably below GitHub's 2 GiB limit.
          MAX_SIZE=$((1800 * 1024 * 1024))

          part=1
          current_size=0

          while IFS= read -r -d '' file; do

            # Remove the leading "./"
            relative="${file#./}"

            size=$(stat -c%s "$file")

            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo "ERROR: $relative is larger than the maximum PK3 size."
              exit 1
            fi

            # Start a new PK3 if this file would make the current
            # one too large.
            if [ $((current_size + size)) -gt "$MAX_SIZE" ] && [ "$current_size" -gt 0 ]; then

              echo "Creating part $(printf '%02d' "$part")..."

              (
                cd current
                zip -0 -r "../build/z_zz_SchizoPack_$(printf '%02d' "$part").pk3" .
              )

              rm -rf current
              mkdir -p current

              part=$((part + 1))
              current_size=0
            fi

            # Copy file while preserving its directory structure.
            mkdir -p "current/$(dirname "$relative")"
            cp "$file" "current/$relative"

            current_size=$((current_size + size))

          done < <(
            find . \
              -type f \
              ! -path './.git/*' \
              ! -path './.github/*' \
              ! -path './build/*' \
              -print0
          )

          # Create final PK3.
          if [ "$current_size" -gt 0 ]; then

            echo "Creating final part $(printf '%02d' "$part")..."

            (
              cd current
              zip -0 -r "../build/z_zz_SchizoPack_$(printf '%02d' "$part").pk3" .
            )

          fi

          echo ""
          echo "=============================="
          echo "Created PK3 files:"
          echo "=============================="

          ls -lh build/

      - name: Verify PK3 sizes
        shell: bash
        run: |
          MAX_SIZE=$((2147483647))

          for file in build/*.pk3; do
            size=$(stat -c%s "$file")

            echo "$file: $size bytes"

            if [ "$size" -ge "$MAX_SIZE" ]; then
              echo "ERROR: $file is too large for GitHub Releases."
              exit 1
            fi
          done

      - name: Upload Release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: 'build/*.pk3'
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true